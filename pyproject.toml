[project]
name = "fedramp-ksi"
version = "0.1.0"
description = "FedRAMP 20x Key Security Indicators as code, with automated evidence."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.uv]
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
