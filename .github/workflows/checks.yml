# Checks for fedramp-20x-ksi
#
# Runs on every pull request and every push to main:
#   1. Lint:   Ruff finds style issues and likely bugs
#   2. Format: code follows Ruff's standard style
#   3. Tests:  the pinned KSI catalog loads, matches its hashes and FedRAMP's
#              schema, and hasn't drifted from the expected themes and indicators
#
# No credentials are needed or stored. uv installs from the lockfile only.

name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Tests
        run: uv run pytest
